<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜湖疗养院 · ARG网页解密游戏</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d10;color:#c9c9c9;font-family:"SimSun","宋体",serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;inset:0;z-index:0;background:radial-gradient(130% 100% at 50% 10%,rgba(22,38,56,.6),transparent 55%),radial-gradient(90% 55% at 50% 104%,rgba(8,16,26,.85),transparent 62%)}
  body::after{content:'';position:fixed;inset:0;z-index:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.011) 0 1px,transparent 1px 3px)}
  .frame{position:fixed;inset:30px;z-index:1;border:1px solid rgba(120,44,52,.32);pointer-events:none}
  .frame::before,.frame::after{content:'';position:absolute;width:16px;height:16px;border:1px solid rgba(190,74,84,.6)}
  .frame::before{left:-1px;top:-1px;border-right:none;border-bottom:none}
  .frame::after{right:-1px;bottom:-1px;border-left:none;border-top:none}
  .wrap{position:relative;z-index:2;text-align:center;padding:40px}
  .eyebrow{font-size:11px;color:#5e6670;letter-spacing:6px;text-transform:uppercase;margin-bottom:14px}
  .title{font-size:32px;letter-spacing:16px;margin:0 0 4px;color:#e8e1d4;font-weight:bold;text-shadow:0 2px 24px rgba(0,0,0,.7)}
  .title .red{color:#a3212e;text-shadow:0 0 18px rgba(190,30,40,.5)}
  .rule{width:120px;height:1px;margin:16px auto 6px;background:linear-gradient(90deg,transparent,#7a2027,transparent)}
  .sub{font-size:13px;color:#7c828c;letter-spacing:4px;margin:6px 0 42px}
  .ring{width:36px;height:36px;border-radius:50%;margin:0 auto 24px;position:relative;background:conic-gradient(from 0deg,#a3212e 0 110deg,transparent 110deg 360deg);-webkit-mask:radial-gradient(circle,transparent 55%,#000 56%);mask:radial-gradient(circle,transparent 55%,#000 56%);animation:spin 1.05s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ring::after{content:'';position:absolute;inset:11px;border-radius:50%;background:#a3212e;opacity:.65;filter:blur(6px);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
  .loading{font-size:12px;color:#8a909a;letter-spacing:2px;animation:breath 2.2s ease-in-out infinite}
  @keyframes breath{0%,100%{opacity:.55}50%{opacity:1}}
  .link{display:inline-block;margin-top:30px;padding:12px 42px;background:linear-gradient(180deg,#3a1218,#230b0e);color:#c9a8ab;text-decoration:none;font-size:14px;letter-spacing:6px;border:1px solid #5c1f24;border-radius:2px;transition:all .3s}
  .link:hover{color:#ffe9ea;border-color:#a13;box-shadow:0 0 20px rgba(160,20,30,.45)}
</style>
<meta http-equiv="refresh" content="2;url=镜湖疗养院/index.html">
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="eyebrow">JINGHU SANATORIUM · 2003</div>
    <div class="title">镜<span class="red">湖</span>疗养院</div>
    <div class="rule"></div>
    <div class="sub">你忘了，它还记得。</div>
    <div class="ring"></div>
    <div class="loading">正在进入病区</div>
    <div style="margin-top:30px">
      <a href="镜湖疗养院/index.html" class="link">如未跳转 点击进入</a>
    </div>
  </div>
</body>
</html>
