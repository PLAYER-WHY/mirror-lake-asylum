<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜湖疗养院 · 病历查询系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --face:#c0c0c0;--face-dark:#a0a0a0;--shadow:#808080;--light:#dfdfdf;--white:#fff;
  --text:#000;--text-dim:#404040;
  --title-1:#000080;--title-2:#1084d0;
  --green:#008000;--dark-green:#006400;--amber:#808000;--red:#800000;--blue:#000080;
  --input-bg:#fff;--desktop:#008080;
}
body{font-family:"宋体",SimSun,"Microsoft YaHei",sans-serif;background:var(--desktop);color:var(--text);min-height:100vh;font-size:13px;line-height:1.7}
a{color:#0000ee;text-decoration:underline}
.hidden{display:none!important}

/* ===== 窗口标题栏 ===== */
.top-bar{background:linear-gradient(90deg,var(--title-1),var(--title-2));color:#fff;padding:3px 4px;display:flex;justify-content:space-between;align-items:center;height:28px;border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white)}
.top-bar .tb-left{display:flex;align-items:center;gap:8px;padding-left:4px;min-width:0}
.top-bar .tb-logo{width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:13px;white-space:nowrap;flex-shrink:0;font-weight:bold}
.top-bar h1{font-size:13px;font-weight:bold;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-bar .tb-right{font-size:11px;display:flex;align-items:center;gap:12px;padding-right:4px}
.top-bar .tb-right span{color:#fff}
.top-bar .tb-status{display:flex;align-items:center;gap:4px}
.top-bar .tb-dot{width:7px;height:7px;background:#0f0;border:1px solid #080}
.top-bar .tb-btn{width:18px;height:16px;background:var(--face);border:1px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);display:flex;align-items:center;justify-content:center;font-size:10px;color:#000;cursor:pointer;font-family:Marlett,sans-serif}
.tb-back{color:#fff;cursor:pointer;font-size:11px;text-decoration:underline}
.tb-back:hover{color:#ffff00}

/* ===== 窗口主体 ===== */
.main-wrap{max-width:820px;margin:8px auto;padding:0;background:var(--face);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow)}
body.maximized .main-wrap{max-width:100%;margin:0;border:none}

/* ===== 登录页 ===== */
.login-page{margin:20px;padding:20px;background:var(--face);border:1px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow)}
.login-page .lp-title{text-align:center;margin-bottom:20px}
.login-page .lp-title h2{color:var(--title-1);font-size:16px;font-weight:bold;margin-bottom:4px}
.login-page .lp-title p{color:var(--text-dim);font-size:11px}
.login-form{max-width:320px;margin:0 auto}
.login-form .lf-group{margin-bottom:12px}
.login-form .lf-label{font-size:12px;color:var(--text);margin-bottom:4px;display:block}
.login-form .lf-label .lf-hint{color:var(--text-dim);font-size:11px;margin-left:6px}
.login-form input{width:100%;padding:3px 4px;background:var(--white);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);color:var(--text);font-size:13px;font-family:"宋体",SimSun,monospace}
.login-form input:focus{outline:none;border-width:1px}
.login-form .lf-error{color:var(--red);font-size:11px;margin-top:2px;min-height:14px}
.login-form .lf-submit{padding:4px 20px;background:var(--face);border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);color:var(--text);font-size:13px;font-family:"宋体",SimSun,sans-serif;cursor:pointer;min-width:100px}
.login-form .lf-submit:hover{background:var(--light)}
.login-form .lf-submit:active{border-color:var(--shadow) var(--white) var(--white) var(--shadow)}
.login-form .lf-submit:disabled{color:var(--shadow);cursor:not-allowed}

/* ===== 病历主界面 · 左右布局（真实HIS风格） ===== */
.his-body{display:flex;margin:0 4px;}
.his-nav{flex:0 0 150px;background:var(--face);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);border-right:none;padding:6px 3px 6px 3px;display:flex;flex-direction:column;gap:2px}
.his-nav .hn-title{font-size:11px;color:var(--title-1);font-weight:bold;padding:2px 8px 4px;border-bottom:1px solid var(--shadow);margin-bottom:4px;letter-spacing:1px}
.his-nav .hn-foot{font-size:10px;color:var(--text-dim);text-align:center;margin-top:auto;padding-top:6px;border-top:1px solid var(--shadow)}
.his-main{flex:1;min-width:0}
.layer-tab{display:flex;align-items:center;gap:7px;padding:7px 8px;font-size:12px;color:var(--text-dim);background:var(--face);border:1px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);cursor:pointer;user-select:none}
.layer-tab .lt-icon{font-size:12px;width:16px;text-align:center;flex:none}
.layer-tab .lt-name{line-height:1.2}
.layer-tab.unlocked{color:var(--text)}
.layer-tab.active{color:var(--text);font-weight:bold;background:var(--light);border-color:var(--white) var(--shadow) var(--shadow) var(--white);box-shadow:inset 1px 1px 0 var(--white)}
.layer-tab.active .lt-icon{color:var(--title-1)}
.layer-tab.locked{color:var(--shadow);cursor:not-allowed}
.layer-tab:hover:not(.locked):not(.active){background:var(--light)}
.hn-back{display:flex;align-items:center;gap:7px;padding:7px 8px;font-size:12px;color:var(--title-1);background:var(--light);border:1px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);cursor:pointer;user-select:none;margin-top:6px}
.hn-back .lt-icon{font-size:12px;width:16px;text-align:center;flex:none}
.hn-back:hover{background:#e4efe9}

/* ===== 记录面板 ===== */
.record-panel{background:var(--white);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);border-top:2px solid var(--shadow);margin:0 0 4px;padding:20px;min-height:400px;overflow-y:auto;max-height:70vh}
.record-panel .rp-header{text-align:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--face-dark)}
.record-panel .rp-header h3{color:var(--title-1);font-size:15px;font-weight:bold;margin-bottom:4px}
.record-panel .rp-header .rp-meta{font-size:11px;color:var(--text-dim)}

/* ===== 病历表格 ===== */
.med-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:14px;border:1px solid var(--shadow);background:var(--white)}
.med-table td{padding:6px 8px;vertical-align:top;border:1px solid var(--face-dark)}
.med-table tr:nth-child(even){background:#f0f0f0}
.med-table .mt-label{color:var(--text-dim);width:130px;font-size:11px;background:var(--face)}
.med-table .mt-value{color:var(--text)}
.med-table .mt-value.red{color:var(--red);font-weight:bold}
.med-table .mt-value.green{color:var(--dark-green);font-weight:bold}
.med-table .mt-value.amber{color:var(--amber);font-weight:bold}
.med-table .mt-value.bold{font-weight:bold}

/* ===== 用药记录 ===== */
.med-log{margin-bottom:14px}
.med-log .ml-entry{background:#f8f8f8;border:1px solid var(--face-dark);border-left:3px solid var(--green);padding:8px 12px;margin-bottom:6px}
.med-log .ml-entry.danger{border-left-color:var(--red);background:#fff0f0}
.med-log .ml-entry .ml-date{font-size:11px;color:var(--text-dim);margin-bottom:3px}
.med-log .ml-entry .ml-drug{font-size:13px;color:var(--title-1);font-weight:bold;margin-bottom:4px}
.med-log .ml-entry.danger .ml-drug{color:var(--red)}
.med-log .ml-entry .ml-note{font-size:12px;color:var(--text);line-height:1.6}
.med-log .ml-entry .ml-effect{font-size:11px;color:var(--amber);margin-top:4px;font-style:italic;border-top:1px dotted var(--face-dark);padding-top:4px}

/* ===== 实验记录 ===== */
.exp-section{margin-bottom:16px}
.exp-section .es-title{font-size:13px;color:var(--title-1);font-weight:bold;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--face-dark);background:var(--face);padding:4px 8px}
.exp-subject{background:#f8f8f8;border:1px solid var(--face-dark);padding:10px;margin-bottom:8px}
.exp-subject .es-id{font-size:13px;color:var(--amber);font-weight:bold;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--face-dark)}
.exp-subject .es-row{display:flex;gap:10px;margin-bottom:3px;font-size:12px}
.exp-subject .es-label{color:var(--text-dim);min-width:80px}
.exp-subject .es-val{color:var(--text)}
.exp-subject.success{border-left:3px solid var(--green)}
.exp-subject.failed{border-left:3px solid var(--red)}
.exp-subject.deceased{border-left:3px solid var(--shadow);opacity:0.7}
.exp-subject.success .es-id{color:var(--dark-green)}
.exp-subject.failed .es-id{color:var(--red)}
.exp-subject.deceased .es-id{color:var(--text-dim)}

/* ===== 密码输入 ===== */
.password-gate{max-width:320px;margin:32px auto;text-align:center}
.password-gate .pg-icon{font-size:32px;margin-bottom:10px;opacity:0.5}
.password-gate .pg-title{color:var(--amber);font-size:14px;margin-bottom:4px;font-weight:bold}
.password-gate .pg-hint{color:var(--text-dim);font-size:11px;margin-bottom:16px;line-height:1.8}
.password-gate input{width:100%;padding:3px 6px;background:var(--white);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);color:var(--text);font-size:13px;font-family:"宋体",SimSun,monospace;text-align:center;letter-spacing:2px}
.password-gate input:focus{outline:none;border-width:1px}
.password-gate button{padding:4px 24px;background:var(--face);border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);color:var(--text);font-size:12px;font-family:"宋体",SimSun,sans-serif;cursor:pointer;min-width:120px;margin-top:6px}
.password-gate button:hover{background:var(--light)}
.password-gate button:active{border-color:var(--shadow) var(--white) var(--white) var(--shadow)}
.password-gate .pg-error{color:var(--red);font-size:11px;margin-top:6px;min-height:14px}

/* ===== 蓝笔批注（不突兀，像手写标注） ===== */
.blue-note{
  display:inline-block;margin-left:8px;font-family:'Courier New',monospace;font-size:12px;
  color:#204f9e;letter-spacing:1px;vertical-align:baseline;font-style:normal;
}

/* ===== 匿名打码（灰色马赛克）：盖住研究者姓名，切"正义的光"实名才揭晓 ===== */
.maskname{
  background:#b9b9b9;color:#b9b9b9;border-radius:2px;padding:0 5px;
  user-select:none;filter:blur(.5px);
}

/* ===== 病历图片容器 + 蓝笔签字叠加 ===== */
.med-img-wrap{position:relative;display:inline-block}
.med-img-wrap img{max-width:100%;border:1px solid var(--shadow);box-shadow:2px 2px 6px rgba(0,0,0,.15);display:block}
.fang-sign{
  position:absolute;right:14px;bottom:16px;
  font-family:"KaiTi","楷体",serif;color:#1a3a8a;font-size:22px;font-weight:bold;
  letter-spacing:4px;transform:rotate(-6deg);opacity:.65;
  text-shadow:0 0 1px rgba(26,58,138,.4);pointer-events:none;line-height:1;
}
.fang-sign::after{content:"";display:block;width:32px;height:2px;background:#1a3a8a;margin-top:3px;transform:rotate(-2deg);opacity:.5;border-radius:1px}

/* ===== 档案入口 ===== */
.archives-entry{text-align:center;margin:24px 0;padding:16px;background:#e8e8f0;border:1px solid var(--face-dark)}
.archives-entry .ae-title{color:var(--title-1);font-size:14px;margin-bottom:4px;font-weight:bold}
.archives-entry .ae-desc{color:var(--text-dim);font-size:11px;margin-bottom:12px;line-height:1.7}
.archives-entry button{padding:4px 28px;background:var(--face);border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);color:var(--text);font-size:13px;font-family:"宋体",SimSun,sans-serif;cursor:pointer}
.archives-entry button:hover{background:var(--light)}
.archives-entry button:active{border-color:var(--shadow) var(--white) var(--white) var(--shadow)}

/* ===== 隐藏层 ===== */
.hidden-layer{background:#fff0f0;border:1px solid var(--red);padding:16px;margin:16px 0}
.hidden-layer .hl-title{color:var(--red);font-size:14px;text-align:center;margin-bottom:14px;font-weight:bold}
.hidden-layer .hl-entry{background:var(--white);border-left:3px solid var(--red);padding:10px;margin-bottom:8px}
.hidden-layer .hl-date{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.hidden-layer .hl-content{font-size:12px;color:var(--text);line-height:1.8}

/* ===== 返回论坛 ===== */
.back-to-forum{text-align:center;margin:24px 0}
.back-to-forum a{display:inline-block;padding:4px 24px;background:var(--face);border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);color:#0000ee;font-size:12px;text-decoration:none}
.back-to-forum a:hover{background:var(--light)}

/* ===== 通知 ===== */
.notif{position:fixed;top:16px;right:16px;background:var(--face);border:2px solid;border-color:var(--white) var(--shadow) var(--shadow) var(--white);padding:8px 12px;font-size:12px;color:var(--dark-green);z-index:100;box-shadow:2px 2px 4px rgba(0,0,0,.15)}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===== 状态栏 ===== */
.status-bar{display:flex;justify-content:space-between;align-items:center;padding:3px 8px;background:var(--face);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);font-size:11px;color:var(--text-dim)}
.status-bar .sb-left{display:flex;align-items:center;gap:6px}
.status-bar .sb-right{display:flex;align-items:center;gap:6px}
.status-bar .sb-sep{color:var(--shadow)}

/* ===== 响应式 ===== */
@media(max-width:768px){
  .main-wrap{margin:0;border:none}
  .login-page{padding:14px}
  .top-bar{height:24px}
  .top-bar h1{font-size:11px}
  .his-body{flex-direction:column;margin:0}
  .his-nav{flex:none;width:auto;flex-direction:row;border-right:2px solid var(--shadow);border-bottom:none;padding:4px;overflow-x:auto}
  .his-nav .hn-title{display:none}
  .his-nav .hn-foot{display:none}
  .layer-tab{font-size:11px;padding:6px 9px;flex:none;white-space:nowrap}
  .layer-tab .lt-name{display:none}
  .record-panel{padding:12px;margin:0 0 4px}
  .med-table .mt-label{width:90px;font-size:10px}
  .top-bar .tb-right{gap:6px;font-size:10px}
}

/* ===== 病历列表（医生工作台） ===== */
.cl-header{padding:14px 20px;background:var(--white);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);margin:0 4px 4px}
.cl-header .cl-title{color:var(--title-1);font-size:15px;font-weight:bold;margin-bottom:6px}
.cl-header .cl-meta{color:var(--text-dim);font-size:11px}
.cl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;padding:4px 4px 4px;margin:0 4px}
.case-card{background:var(--white);border:2px solid;border-color:var(--shadow) var(--white) var(--white) var(--shadow);padding:12px;cursor:pointer;position:relative;transition:box-shadow .15s}
.case-card:hover{box-shadow:2px 2px 0 rgba(0,0,0,.12)}
.case-card.focus{border-left:3px solid var(--title-1)}
.case-card .cc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.case-card .cc-no{font-size:13px;font-weight:bold;color:var(--title-1);font-family:"Courier New",monospace}
.case-card.focus .cc-no{color:var(--red)}
.case-card .cc-status{font-size:10px;color:var(--text-dim)}
.case-card .cc-name{font-size:14px;font-weight:bold;color:var(--text);margin-bottom:3px}
.case-card .cc-dept{font-size:11px;color:var(--text-dim);margin-bottom:8px}
.case-card .cc-key{font-size:11px;color:var(--text);line-height:1.5;margin-bottom:8px}
.case-card .cc-lock{font-size:10px;color:var(--amber);font-weight:bold}
@media(max-width:768px){
  .cl-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:0}
  .cl-header{padding:10px 12px}
}
</style>
</head>
<body>

<!-- 顶栏（窗口标题栏） -->
<div class="top-bar">
  <div class="tb-left">
    <div class="tb-logo">镜</div>
    <h1>镜湖疗养院病历查询系统 - v3.2.1</h1>
  </div>
  <div class="tb-right">
    <div class="tb-status"><span class="tb-dot"></span><span id="sys-status">系统运行中</span></div>
    <span class="tb-back" onclick="backToForum()">返回论坛</span>
    <div class="tb-btn" title="最小化" onclick="recordsMinimize()">_</div>
    <div class="tb-btn" title="最大化" onclick="toggleRecordsMax()">□</div>
    <div class="tb-btn" title="关闭" onclick="window.close()">×</div>
  </div>
</div>

<!-- 主体 -->
<div class="main-wrap">

<!-- ===== 登录页 ===== -->
<div id="page-login" class="login-page">
  <div class="lp-title">
    <h2>镜湖疗养院 · 病历查询系统</h2>
    <p>医生专用 · 请输入您的工号与登录密码 · 系统已运行1095天</p>
  </div>
  <div class="login-form">
    <div class="lf-group">
      <label class="lf-label">医生工号</label>
      <input type="text" id="login-pid" placeholder="请输入医生工号" autocomplete="off">
    </div>
    <div class="lf-group">
      <label class="lf-label">登录密码</label>
      <input type="password" id="login-pass" placeholder="请输入密码" maxlength="20" autocomplete="off">
    </div>
    <div class="lf-error" id="login-error"></div>
    <button class="lf-submit" onclick="tryLogin()">登 录 查 询</button>
  </div>
</div>

<!-- ===== 病历列表（医生工作台） ===== -->
<div id="page-caselist" class="hidden">
  <div class="cl-header">
    <div class="cl-title">[病历] 病历列表 · 全部患者</div>
    <div class="cl-meta">登录医生：沈望川 JH-008 · 本院病历共 8 份 · 权限：主治医生</div>
  </div>
  <div class="cl-grid" id="cl-grid"></div>
  <div class="back-to-forum">
    <a href="javascript:void(0)" onclick="backToForum()">返回论坛</a>
  </div>
</div>

<!-- ===== 病历主界面 ===== -->
<div id="page-records" class="hidden">
  <div class="his-body">
    <!-- 左侧：功能导航（真实HIS风格） -->
    <div class="his-nav" id="layer-nav">
      <div class="hn-title">导　航</div>
      <div class="layer-tab active" id="tab-1" onclick="switchLayer(1)">
        <span class="lt-icon">[档]</span><span class="lt-name">患者信息</span>
      </div>
      <div class="layer-tab locked" id="tab-2" onclick="switchLayer(2)">
        <span class="lt-icon">[锁]</span><span class="lt-name">用药记录</span>
      </div>
      <div class="layer-tab locked" id="tab-3" onclick="switchLayer(3)">
        <span class="lt-icon">[锁]</span><span class="lt-name">项目记录</span>
      </div>
      <div class="layer-tab locked" id="tab-4" onclick="switchLayer(4)">
        <span class="lt-icon">[锁]</span><span class="lt-name">批注档案</span>
      </div>
      <div class="hn-back" onclick="backToCaseList()">
        <span class="lt-icon">←</span><span class="lt-name">返回病历列表</span>
      </div>
      <div class="hn-foot">权限级别</div>
    </div>

    <!-- 右侧：记录面板 -->
    <div class="his-main">
      <div class="record-panel" id="record-panel"></div>
    </div>
  </div>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <div class="sb-left" id="sb-status">就绪</div>
  <div class="sb-right">
    <span id="sb-layer">患者信息</span>
    <span class="sb-sep">|</span>
    <span>镜湖疗养院信息系统 ©2003</span>
  </div>
</div>

</div>

<script>
/* ================================================================
   游戏状态 & 跨页面联动
   ================================================================ */
const DEFAULT_STATE={
  unlockedLayers:0,endingChoice:null,
  forumNewPosts:[],forumNewReplies:[],forumNewPMs:[],
  fangAccountFound:false,m3DrugFound:false,
  archivesUnlocked:false,diaryUnlocked:false,pmsUnlocked:false,
  discoveredClues:[],countdownActive:false,countdownEndTime:null,
  readPosts:[],repliedPosts:{},triggeredFlashes:[],
  playerLoggedIn:false,shenBirthdayFound:false
};
function loadState(){try{var s=JSON.parse(localStorage.getItem('gameState'));return s?Object.assign({},DEFAULT_STATE,s):Object.assign({},DEFAULT_STATE)}catch(e){return Object.assign({},DEFAULT_STATE)}}
function saveState(s){localStorage.setItem('gameState',JSON.stringify(s))}
function updateState(patch){const s=loadState();Object.assign(s,patch);saveState(s);return s}

function openCase(id){
  const c=CASES.filter(function(x){return x.id===id})[0];
  if(!c) return;
  if(c.locked){
    const pw=prompt('该病历已归档，请输入授权码：');
    if(pw===null) return;
    if(pw.trim().toUpperCase()===c.pass){
      showCaseView(c);
    }else{
      showNotif('密码错误。','error');
    }
    return;
  }
  showCaseView(c);
}

function backToForum(){
  var opener=null;
  try{ opener=window.opener; }catch(e){}
  if(opener && !opener.closed){
    try{ if(typeof opener.focus==='function') opener.focus(); }catch(e){}
    try{ window.close(); }catch(e){}
    // 若 close 被浏览器拦截（如被当作独立标签打开），则本页直接回论坛
    if(!window.closed){
      try{ window.location.href='index.html'; }catch(e){}
    }
    return;
  }
  try{ window.location.href='index.html'; }catch(e){}
}

/* ================================================================
   层级切换
   ================================================================ */
function switchLayer(n){
  const state=loadState();
  // 真正锁定未解锁的层级：防止点击仍带 .locked 的 tab 提前跳转（例如直接打开档案系统绕过镜像）
  const targetTab=document.getElementById('tab-'+n);
  if(targetTab&&targetTab.classList.contains('locked')){
    showNotif('该层级尚未解锁，请先完成上一层验证。','warn');
    return;
  }
  const maxUnlocked=state.unlockedLayers;
  // 对于未解锁的层级（L2/L3/L4前序门/L5/L6前序门），依然允许进入并渲染密码验证面板，
  // 只有密码验证通过后才会推进 unlockedLayers（最多只能进入当前解锁层+1，防止跳关）
  if(n>maxUnlocked&&n>maxUnlocked+1){
    // 限制只能跳到当前解锁层+1（允许进入密码门），超过则阻断
    showNotif('该层级尚未解锁','warn');
    return;
  }
  // 更新tab状态
  for(var i=1;i<=5;i++){
    var tab=document.getElementById('tab-'+i);
    if(!tab){continue;}
    tab.classList.remove('active');
    if(i<=maxUnlocked){
      tab.classList.remove('locked');
      tab.classList.add('unlocked');
    }
  }
  document.getElementById('tab-'+n).classList.add('active');
  // 状态栏同步当前功能名（替代"第X层"）
  const layerName=['患者信息','用药记录','项目记录','批注档案'];
  const st=document.getElementById('sb-layer');
  if(st) st.textContent=(layerName[n-1]||'—');
  const sts=document.getElementById('sb-status');
  if(sts) sts.textContent='就绪';
  // 渲染对应内容
  const panel=document.getElementById('record-panel');
  if(n===1){renderLayer1(panel)}
  else if(n===2){renderLayer2(panel)}
  else if(n===3){renderLayer3(panel)}
  else if(n===4){renderLayer4Gate(panel)}
}

/* ================================================================
   通知
   ================================================================ */
function showNotif(msg,type){
  var n=document.createElement('div');
  n.className='notif';
  if(type==='warn'){n.style.borderColor='var(--amber)';n.style.color='var(--amber)'}
  else if(type==='error'){n.style.borderColor='var(--red)';n.style.color='var(--red)'}
  n.textContent=msg;
  document.body.appendChild(n);
  setTimeout(function(){n.style.opacity='0';n.style.transition='opacity .5s';setTimeout(function(){n.remove()},500)},3000);
}
