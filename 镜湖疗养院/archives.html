<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>镜湖疗养院 · 内部档案系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#cfd6e0;--panel:#eef1f5;--border:#9aa7b8;--text:#2c3a4a;--text-dim:#6a7686;
  --green:#2d7a4d;--amber:#b07818;--red:#b3433a;--blue:#1f4a80;--white:#fff;
  --purple:#8a4da8;
  --input-bg:#ffffff;
}
body{font-family:'SimSun','宋体',serif;
  background:#cfd6e0;
  color:var(--text);min-height:100vh;font-size:14px;line-height:1.8}
.hidden{display:none!important}

/* 顶栏（医院 HIS 标题栏） */
.top-bar{
  background: #1f3a5c;
  background-image: linear-gradient(180deg, #2c4a72 0%, #1f3a5c 100%);
  border-bottom: 2px solid #14283e;
  padding: 8px 22px;
  display:flex;justify-content:space-between;align-items:center;
  box-shadow: 0 1px 3px rgba(0,0,0,.25);
}
.top-bar .tb-left{display:flex;align-items:center;gap:12px}
.top-bar .tb-logo{
  width:30px;height:30px;border:1px solid #7ea4c8;border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:15px;color:#dbe7f3;
  background: #29476b;
  font-family: 'SimSun','宋体',serif;
  font-weight:700;
}
.top-bar h1{font-size:14px;color:#f2f6fb;font-weight:700;letter-spacing:2px;font-family:'Microsoft YaHei','SimHei',sans-serif;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.top-bar .tb-right{font-size:12px;color:#bcd0e4;display:flex;align-items:center;gap:10px}
.top-bar .tb-back{color:#eaf2fa;cursor:pointer;font-size:12px;border:1px solid #6d93ba;padding:4px 10px;border-radius:2px}
.top-bar .tb-back:hover{background:#2c4a72;text-decoration:none}

/* 主体 */
.main-wrap{max-width:1180px;margin:0 auto;padding:22px 24px 40px}

/* Tab导航（卷宗分页） */
.arc-tabs{
  display:flex;gap:3px;
  background: transparent;
  border:none;
  overflow:visible;
  padding: 0 2px;
}
.arc-tab{
  flex:1;
  padding: 13px 10px 11px;
  text-align:center;
  font-size:13px;
  color:#5a6470;
  background: #dbe2ea;
  border: 1px solid #9aa7b8;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  cursor:pointer;
  transition: all .18s ease;
  position: relative;
  bottom: -1px;
  font-family: 'Microsoft YaHei','SimHei',sans-serif;
  font-weight: 600;
  letter-spacing: 1px;
  box-shadow: 0 -1px 0 rgba(255,255,255,.4) inset;
}
.arc-tab.active{
  color:#26313f;
  background: #eef1f5;
  border-color:#8b9bb0;
  box-shadow:
    0 -2px 0 rgba(255,255,255,.7) inset,
    0 -3px 0 #8b9bb0 inset;
  transform: translateY(-1px);
  z-index: 2;
}
.arc-tab:hover:not(.active){
  background: #ccd5e0;
  color:#2c3a4a;
}
.arc-tab .at-icon{
  display:block;
  font-size:16px;
  margin-bottom:4px;
  color:#4a5a6e;
  font-weight: 700;
  letter-spacing: 2px;
}
.arc-tab.active .at-icon{ color:#b3433a }

/* 内容面板 */
.arc-panel{
  background: #eef1f5;
  background-image:
    radial-gradient(1000px 400px at 100% 0%, rgba(31,74,128,.05), transparent 60%),
    linear-gradient(rgba(31,74,128,.02) 1px, transparent 1px);
  background-size: 100% 24px;
  border: 1px solid #8b9bb0;
  border-top: 2px solid #8b9bb0;
  border-radius: 0 0 6px 6px;
  padding: 20px 22px 28px;
  min-height: 520px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.6) inset,
    0 6px 20px rgba(44,58,74,.12);
  position: relative;
}

/* 文件管理器（档案管理）面包屑 + 文件夹 */
.arc-crumb{max-width:1180px;margin:6px auto 0;padding:0 24px;font-size:12px;color:#6f7b89;letter-spacing:.3px}
.arc-crumb .crumb-link{color:#1f4a80;cursor:pointer}
.arc-crumb .crumb-link:hover{text-decoration:underline}
.af-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:12px 6px 30px}
.af-item{background:#eef1f5;border:1px solid #b8c2cf;border-radius:3px;padding:20px 14px;text-align:center;cursor:pointer;transition:all .15s;position:relative}
.af-item:hover{background:#e3e9f0;border-color:#8b9bb0;box-shadow:0 4px 12px rgba(44,58,74,.14)}
.af-item .af-icon{font-size:34px;margin-bottom:8px}
.af-item .af-name{font-size:13px;color:#2c3a4a;font-weight:bold}
.af-item .af-desc{font-size:11px;color:#6f7b89;margin-top:4px;line-height:1.5}
.af-item .af-lock{position:absolute;top:8px;right:10px;font-size:14px}
.af-item.locked{opacity:.72}
.af-file{display:flex;align-items:flex-start;gap:12px;background:#fff;border:1px solid #b8c2cf;padding:14px 16px;margin-bottom:10px;border-radius:2px;font-family:'SimSun','宋体',serif}
.af-file .ff-icon{font-size:22px;flex-shrink:0;line-height:1.6}
.af-file .ff-name{font-size:13px;color:#2c3a4a;font-weight:bold;margin-bottom:4px}
.af-file .ff-body{font-size:12.5px;color:#3a3a3a;line-height:1.9}
.af-file.twocol .ff-body{color:#4a5f74}
.af-backbtn{display:inline-block;padding:5px 16px;background:#eef1f5;border:1px solid #9aa7b8;color:#2c3a4a;font-size:12px;border-radius:2px;cursor:pointer}
.af-backbtn:hover{background:#e3e9f0}
.af-note{background:#eef4f0;border:1px solid #b7c9bf;border-left:4px solid #2d7a4d;padding:12px 16px;margin-bottom:12px;border-radius:2px;font-family:'KaiTi','楷体',serif;font-size:13px;color:#2f4a3b;line-height:2}
.af-file.note-scan{background-image:url(assets/scans/handwritten-note.jpg);background-size:cover;background-position:center;background-blend-mode:multiply}
.af-file.death-scan{background-image:url(assets/scans/death-report.jpg);background-size:cover;background-position:center;background-blend-mode:multiply}
.pa-wrap.research-scan .pa-card{background-image:url(assets/scans/research-log.jpg);background-size:cover;background-position:center;background-blend-mode:multiply}
/* 扫描件（知情同意书） */
.scan-doc{background:#fdfdf6;background-image:url(assets/scans/consent-form.jpg);background-size:cover;background-position:center;background-blend-mode:multiply;border:1px solid #d8d2c0;border-radius:2px;box-shadow:0 2px 8px rgba(0,0,0,.08);padding:16px 22px 18px;margin-bottom:14px;position:relative;font-family:'SimSun','宋体',serif;color:#333;max-width:640px}
.scan-doc.death{background-image:url(assets/scans/death-report.jpg)}
.scan-doc.research{background-image:url(assets/scans/research-log.jpg)}
.scan-doc.note{background-image:url(assets/scans/handwritten-note.jpg);font-family:'KaiTi','楷体',serif}
.scan-doc::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.02));pointer-events:none}
.scan-doc .sd-title{text-align:center;font-size:18px;letter-spacing:10px;font-weight:bold;color:#2a2a2a;padding-bottom:9px;border-bottom:1px solid #d8d2c0;margin-bottom:12px}
.scan-doc .sd-sub{font-size:10px;color:#aaa;text-align:center;margin-bottom:12px;letter-spacing:1px}
.scan-doc .sd-row{display:flex;font-size:13px;line-height:2}
.scan-doc .sd-row .sd-key{width:96px;color:#777;flex-shrink:0}
.scan-doc .sd-row .sd-val{flex:1;color:#2a2a2a}
.scan-doc .sd-sigline{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid #e6e0d2}
.scan-doc .sd-sig{font-family:'KaiTi','楷体','Segoe Script',cursive;font-size:20px;transform:rotate(-4deg);display:inline-block;padding:0 2px}
.scan-doc .sd-sig.blue{color:#1a4fa0;font-weight:700}
.scan-doc .sd-sig.black{color:#2a2a2a;font-weight:700}
.scan-doc .sd-siglab{font-size:11px;color:#999}
.scan-doc .sd-pen{position:absolute;right:16px;bottom:36px;font-family:'KaiTi','楷体','Segoe Script',cursive;font-size:26px;font-style:italic;transform:rotate(-14deg);color:#1a4fa0;line-height:1;letter-spacing:1px;text-shadow:0.5px 0.5px 0 rgba(26,79,160,.3)}
.scan-doc .sd-pen.black{color:#2a2a2a;transform:rotate(-9deg);text-shadow:0.5px 0.5px 0 rgba(42,42,42,.3)}

/* 操作记录 */
.op-record{background:rgba(0,0,0,.2);border-left:3px solid var(--amber);padding:12px 16px;margin-bottom:8px;border-radius:0 4px 4px 0}
.op-record.danger{border-left-color:var(--red)}
.op-record .or-date{font-size:11px;color:var(--text-dim);margin-bottom:4px}
.op-record .or-action{font-size:14px;color:var(--amber);font-weight:bold;margin-bottom:4px}
.op-record.danger .or-action{color:var(--red)}
.op-record .or-detail{font-size:13px;color:var(--text);line-height:1.6}

/* 研究日志 */
.log-entry{background:rgba(0,0,0,.2);border:1px solid var(--border);border-radius:4px;padding:14px;margin-bottom:12px}
.log-entry .le-date{font-size:11px;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between}
.log-entry .le-title{font-size:14px;color:var(--green);font-weight:bold;margin-bottom:8px}
.log-entry .le-content{font-size:13px;color:var(--text);line-height:1.8}
.log-entry .le-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:bold}
.log-entry .le-tag.success{background:rgba(0,214,143,.15);color:var(--green)}
.log-entry .le-tag.failed{background:rgba(255,71,87,.15);color:var(--red)}
.log-entry .le-tag.death{background:rgba(85,85,85,.2);color:var(--text-dim)}
.log-entry .le-tag.note{background:rgba(255,181,71,.15);color:var(--amber)}

/* 私信记录 */
.pm-record{padding:14px 16px;border-radius:8px;margin-bottom:12px}
.pm-record.from-fang{background:rgba(192,57,43,.1);border-left:3px solid var(--red)}
.pm-record.from-savior{background:rgba(44,62,80,.2);border-left:3px solid var(--blue)}
.pm-record .pm-meta{font-size:11px;color:var(--text-dim);margin-bottom:6px;display:flex;justify-content:space-between}
.pm-record .pm-body{font-size:13px;color:var(--text);line-height:1.8}

/* 信纸 */
.letter-page{background:#ecf0f5;border:1px solid #b3bfcb;padding:40px;max-width:600px;margin:20px auto;border-radius:2px;box-shadow:0 2px 12px rgba(0,0,0,.1);font-family:'KaiTi','楷体',serif;line-height:2.2;font-size:15px;color:#3a3a3a;min-height:300px}
.letter-page .lp-text p{margin-bottom:6px}
.letter-page .lp-sign{text-align:right;margin-top:30px;font-size:13px;color:#666}

/* 返回 */
.back-section{text-align:center;margin:30px 0;padding:20px;background:rgba(52,152,219,.08);border:1px solid var(--blue);border-radius:4px}
.back-section .bs-title{color:var(--blue);font-size:15px;margin-bottom:8px}
.back-section .bs-desc{color:var(--text-dim);font-size:12px;margin-bottom:16px}
.back-section button{padding:12px 30px;background:var(--blue);color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit}
.back-section button:hover{background:#2980b9}

/* 通知 */
.notif{position:fixed;top:16px;right:16px;background:var(--panel);border:1px solid var(--green);border-radius:4px;padding:12px 16px;font-size:13px;color:var(--green);z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);animation:slideIn .3s}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

/* 密码门（L5+L6共用） */
.password-gate{max-width:360px;margin:16px auto;text-align:center;background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:16px}
.password-gate .pg-icon{font-size:28px;margin-bottom:6px;opacity:.55}
.password-gate .pg-title{font-size:13px;margin-bottom:4px;font-weight:bold;letter-spacing:1px}
.password-gate .pg-hint{color:var(--text-dim);font-size:11px;margin-bottom:14px;line-height:1.8;padding:0 10px}
.password-gate input{width:100%;padding:5px 10px;background:#fff;color:#2c3a4a;border:1px solid var(--border);border-radius:2px;font-size:14px;font-family:'Courier New',monospace;text-align:center;letter-spacing:4px}
.password-gate input:focus{outline:none;border-color:var(--blue)}
.password-gate button{padding:5px 28px;background:var(--blue);color:#fff;border:none;border-radius:2px;font-size:12px;cursor:pointer;min-width:120px;margin-top:8px;font-weight:bold;font-family:'Microsoft YaHei',sans-serif}
.password-gate button:hover{background:#16385f}
.password-gate .pg-error{color:var(--red);font-size:11px;margin-top:8px;min-height:14px;line-height:1.6}

/* L6 蓝色碎片（archives） */
.blue-shard-a{
  display:inline-block;margin-left:6px;font-family:'Courier New',monospace;font-weight:bold;font-size:13px;
  color:#4a8acc;background:rgba(74,138,204,.1);padding:1px 6px;border-radius:2px;letter-spacing:1px;
  border:1px solid rgba(74,138,204,.25);vertical-align:baseline;
}

/* ============================================================
   卡片式档案系统（paper-archive）
   仿真实档案卷宗：日历图标 / 日期周次 / 纸张纹理 / 阴影 / 大数字角标
   ============================================================ */
.pa-wrap{
  padding: 10px 4px 30px;
}
.pa-monologue{
  max-width: 560px;
  margin: 30px auto;
  padding: 26px 32px;
  background: #eef1f5;
  border: 1px solid #9aa7b8;
  border-left: 4px solid #1f4a80;
  border-radius: 2px;
  font-size: 14px;
  color: #2c3a4a;
  line-height: 2.1;
  font-family: 'SimSun','宋体',serif;
  box-shadow: 0 1px 0 rgba(255,255,255,.6) inset;
}
.pa-monologue p{margin-bottom: 10px}
.pa-header{
  text-align:center;
  padding: 20px 16px 18px;
  border-bottom: 1px dashed rgba(0,0,0,.15);
  margin-bottom: 22px;
}
.pa-header h3{
  font-size: 18px;
  color: #2c3a4a;
  letter-spacing: 2px;
  margin-bottom: 6px;
  font-family: 'SimSun','宋体',serif;
}
.pa-header .ph-meta{
  font-size: 12px;
  color: #8899aa;
  letter-spacing: 1px;
}
.pa-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px 16px;
}
.pa-card{
  position: relative;
  background: #eef1f5;
  border: 1px solid #b8c2cf;
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -1px 0 rgba(0,0,0,.04) inset,
    0 2px 6px rgba(44,58,74,.10),
    0 8px 18px rgba(44,58,74,.08);
  border-radius: 2px;
  padding: 14px 16px 16px;
  overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease;
  font-family: 'SimSun','宋体',serif;
  line-height: 1.85;
}
.pa-card::before{
  content:'';
  position:absolute; left:0; top:0; right:0; height: 3px;
  background: linear-gradient(90deg, #7ea4c8 0%, #4a6f94 100%);
  opacity: .55;
}
.pa-card:hover{
  transform: translateY(-3px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -1px 0 rgba(0,0,0,.04) inset,
    0 4px 10px rgba(44,58,74,.14),
    0 14px 26px rgba(44,58,74,.12);
}
.pa-card-head{
  display:flex;
  align-items:center;
  justify-content: space-between;
  padding-bottom: 8px;
  margin-bottom: 10px;
  border-bottom: 1px solid rgba(44,58,74,.16);
}
.pa-cal{
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: #5a6470;
}
.pa-cal .pc-icon{
  display: inline-block;
  width: 22px; height: 22px;
  border: 1px solid #5a6470;
  border-radius: 3px;
  position: relative;
  background: #eef1f5;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  color: #5a6470;
  text-align: center;
  line-height: 20px;
  flex-shrink: 0;
}
.pa-cal .pc-icon::before{
  content: '';
  position: absolute;
  top: -2px; left: 4px;
  width: 2px; height: 4px;
  background: #b3433a;
  box-shadow: 10px 0 0 #b3433a;
  border-radius: 1px;
}
.pa-cal .pc-day{
  font-weight: bold;
  color: #2c3a4a;
  letter-spacing: .5px;
}
.pa-cal .pc-wk{
  color: #6f7b89;
}
/* 蓝笔批注（不突兀，像手写标注） */
.pa-note{
  display:inline-block;margin-left:8px;font-family:'Courier New',monospace;font-size:12px;
  color:#204f9e;letter-spacing:1px;font-style:normal;
}
.pa-note.black{color:#3a3a3a;}
.pa-card-title{
  font-size: 15px;
  font-weight: 700;
  color: #1f2d3d;
  margin-bottom: 10px;
  letter-spacing: .5px;
  line-height: 1.5;
  min-height: 44px;
  font-family: 'Microsoft YaHei','SimHei',sans-serif;
}
.pa-card-body{
  font-size: 13px;
  color: #3a3a3a;
  line-height: 1.85;
}
.pa-card-body p{ margin-bottom: 8px; }
.pa-card-body .accent-red{ color:#b3433a; font-weight:600; }
.pa-card-body .accent-green{ color:#2d7a4d; font-weight:600; }
.pa-card-body .accent-amber{ color:#b07818; font-weight:600; }
.pa-card-body .note-inline{
  color: #5a6470;
  font-style: italic;
  font-family: 'KaiTi','楷体',serif;
}
.pa-tag{
  display: inline-block;
  padding: 2px 9px;
  border-radius: 2px;
  font-size: 11px;
  font-weight: 700;
  margin-right: 4px;
  margin-bottom: 4px;
  letter-spacing: .5px;
  font-family: 'Microsoft YaHei','SimHei',sans-serif;
}
.pa-tag.tag-success{ background: #e6f5ec; color:#2d7a4d; border:1px solid #b9dcbc }
.pa-tag.tag-failed{ background:#fae6e4; color:#b3433a; border:1px solid #eabfbb }
.pa-tag.tag-death{ background:#ececee; color:#5a5a6a; border:1px solid #d4d4dc }
.pa-tag.tag-note{ background:#e7edf5; color:#1f4a80; border:1px solid #bfc9d6 }
.pa-tag.tag-project{ background:#e5ecf7; color:#2d5fa8; border:1px solid #bfd0ea }

/* 非卡片页面模块：操作日志、密码门、私信、信纸 */
.pa-op-row{
  position: relative;
  padding: 14px 16px 14px 58px;
  margin-bottom: 10px;
  background: #eef1f5;
  border: 1px solid #b8c2cf;
  border-left: 4px solid #b07818;
  border-radius: 2px;
  box-shadow: 0 2px 6px rgba(44,58,74,.08);
  font-family: 'SimSun','宋体',serif;
}
.pa-op-row.row-danger{
  border-left-color:#b3433a;
  background:#f5eded;
}
.pa-op-row::before{
  content:'✎';
  position:absolute;
  left: 16px; top: 14px;
  width: 30px; height: 30px;
  line-height: 28px;
  text-align:center;
  border:1px solid #a4b0be;
  border-radius: 50%;
  background:#fff;
  color:#5a6470;
  font-size: 16px;
}
.pa-op-row.row-danger::before{
  content:'⚠';
  color: #b3433a;
  border-color:#e2b9b6;
}
.pa-op-date{
  font-size: 11.5px;
  color:#6f7b89;
  letter-spacing: .5px;
  margin-bottom: 4px;
}
.pa-op-action{
  font-size: 14px;
  color:#2c3a4a;
  font-weight: 700;
  margin-bottom: 5px;
  font-family: 'Microsoft YaHei','SimHei',sans-serif;
}
.pa-op-detail{
  font-size: 12.5px;
  color: #3a3a3a;
  line-height: 1.8;
}

/* 私信条 */
.pa-pm{
  position: relative;
  padding: 14px 16px 14px 56px;
  margin-bottom: 10px;
  background:#eef1f5;
  border:1px solid #b8c2cf;
  border-radius: 2px;
  box-shadow:0 2px 6px rgba(44,58,74,.08);
}
.pa-pm::before{
  content:'';
  position:absolute;
  left:14px; top:14px;
  width:32px; height:32px;
  border-radius: 4px;
  text-align:center;
  line-height:32px;
  font-family: 'Microsoft YaHei','SimHei',sans-serif;
  font-weight: 700;
  font-size: 14px;
  color:#fff;
}
.pa-pm.from-fang{ border-left: 4px solid #b3433a; }
.pa-pm.from-fang::before{ content:'正'; background:#b3433a; }

<script>
const DEFAULT_STATE={
  unlockedLayers:0,endingChoice:null,
  forumNewPosts:[],forumNewReplies:[],forumNewPMs:[],
  fangAccountFound:false,m3DrugFound:false,
  archivesUnlocked:false,diaryUnlocked:false,pmsUnlocked:false,
  discoveredClues:[],countdownActive:false,countdownEndTime:null,
  readPosts:[],repliedPosts:{},triggeredFlashes:[],
  playerLoggedIn:false,shenBirthdayFound:false
};
function loadState(){try{var s=JSON.parse(localStorage.getItem('gameState'));return s?Object.assign({},DEFAULT_STATE,s):Object.assign({},DEFAULT_STATE)}catch(e){return Object.assign({},DEFAULT_STATE)}}
function saveState(s){localStorage.setItem('gameState',JSON.stringify(s))}
function updateState(patch){var s=loadState();Object.assign(s,patch);saveState(s);return s}

/* 档案管理 · 资源管理器导航 */
var FOLDERS=[
  {id:'oplog',name:'操作日志文件',desc:'被清理过的记录留档',icon:'🗂'},
  {id:'consent',name:'受试者同意签字归档',desc:'知情同意书 · 死亡报告',icon:'📁'},
  {id:'research',name:'研究记录-机密文件',desc:'需密码解锁',icon:'🔒'},
  {id:'notes',name:'手记文件夹',desc:'批注手记 · 附件',icon:'📝'}
];
function setPath(text){
  var p=document.getElementById('exp-path');
  if(p) p.textContent=text||'档案管理';
}
function toggleArchiveMax(){
  document.body.classList.toggle('maximized');
}
function setStatus(text,n){
  var s=document.getElementById('exp-status');
  if(s) s.textContent=text||'就绪';
  var c=document.getElementById('exp-sb-count');
  if(c) c.textContent=(n!=null?n+' 个对象':'');
}
function buildTree(active){
  var t=document.getElementById('exp-tree');
  if(!t) return;
  var html='<div class="tree-title">文件夹</div>';
  html+='<div class="tree-node'+(active==='root'?' active':'')+'" onclick="backToRoot()">📁 档案管理</div>';
  FOLDERS.forEach(function(f){
    html+='<div class="tree-node'+(active===f.id?' active':'')+'" onclick="openFolder(\''+f.id+'\')">&nbsp;&nbsp;&nbsp;📁 '+f.name+'</div>';
  });
  t.innerHTML=html;
}
function backToRoot(){ showArchiveRoot(); }
function showArchiveRoot(){
  var state=loadState();
  setPath('档案管理'); setStatus('就绪',4); buildTree('root');
  var panel=document.getElementById('arc-panel');
  var html='<div class="af-grid">';
  FOLDERS.forEach(function(f){
    var isResearch=(f.id==='research');
    var icon = isResearch ? (state.diaryUnlocked?'🔓':'🔒') : f.icon;
    var desc = isResearch ? (state.diaryUnlocked?'已解锁 · 可查看':'需密码解锁') : f.desc;
    html+='<div class="af-item'+(isResearch&&!state.diaryUnlocked?' locked':'')+'" onclick="openFolder(\''+f.id+'\')">'
      +'<div class="af-icon">'+icon+'</div>'
      +'<div class="af-name">'+f.name+'</div>'
      +'<div class="af-desc">'+desc+'</div></div>';
  });
  html+='</div>';
  panel.innerHTML=html;
}
function openFolder(name){
  setPath('档案管理 \\ '+name+'\\'); buildTree(name);
  var counts={oplog:6,consent:5,research:9,notes:3};
  setStatus('就绪',counts[name]||0);
  var panel=document.getElementById('arc-panel');
  if(name==='oplog'){ renderOpRecords(panel); }
  else if(name==='consent'){ renderConsentArchive(panel); }
  else if(name==='research'){ renderResearchGate(panel); }
  else if(name==='notes'){ renderNotesFolder(panel); }
}
function appendBackBtn(){
  return '<div style="text-align:center;margin:20px 0 6px"><span class="af-backbtn" onclick="backToRoot()">← 返回档案管理</span></div>';
}

function checkL5(){
  var val=document.getElementById('pw-l5').value.trim();
  var err=document.getElementById('pw-l5-error');
  if(val.replace(/[-\s]/g,'').toUpperCase()==='M20805'){
    updateState({diaryUnlocked:true});
    showNotif('机密卷宗已解锁。');
    setTimeout(function(){
      renderResearchGate(document.getElementById('arc-panel'));
    },600);
  }else{
    err.textContent='错误。';
  }
}

/* L6 验证 */
function checkL6(){
  var val=document.getElementById('pw-l6').value.trim();
  var err=document.getElementById('pw-l6-error');
  if(val==='274159'){
    updateState({l6Unlocked:true,unlockedLayers:6});
    showNotif('蓝字拼好了。六个数字，指向的就是"第七个医生"。');
    setTimeout(function(){renderNotesFolder(document.getElementById('arc-panel'))},900);
  }else{
    window._l6Wrong=(window._l6Wrong||0)+1;
    if(val==='274139'||val==='273159'||val==='234159'){
      err.textContent='错误。是不是带上了那个黑色的？方致远从来不用黑色笔签字。';
    }else if(val==='27415'||val==='2741593'){
      err.textContent='错误。数字个数不对——黑色的那个去掉之后正好6个。';
    }else{
      err.textContent='错误。蓝字的顺序乱了。';
    }
    if(window._l6Wrong>=3){
      showNotif('不对，我好像在哪里看到过……病历 → 用药 → 实验 → 镜像 → 档案 → 论坛。','warn');
      window._l6Wrong=0;
    }
  }
}

/* L6解锁后：返回论坛（结局入口在论坛） */
function finishAndReturn(){
  showNotif('请返回论坛。有些东西……你在论坛里见过的。','warn');
  setTimeout(function(){window.close()},1600);
}

/* 通知 */
function showNotif(msg,type){
  var n=document.createElement('div');
  n.className='notif';
  if(type==='warn'){n.style.borderColor='var(--amber)';n.style.color='var(--amber)'}
  n.textContent=msg;
  n.style.whiteSpace='pre-line';
  document.body.appendChild(n);
  setTimeout(function(){
    n.style.opacity='0';
    n.style.transition='opacity .5s';
    setTimeout(function(){n.remove()},500);
  },5000);
}

/* 初始化 */
window.addEventListener('load',function(){
  showArchiveRoot();
});
